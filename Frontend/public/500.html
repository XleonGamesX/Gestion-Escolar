<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>500 · Error del servidor — Gestión Escolar</title>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <main class="pagina-error">
      <div class="marca">Gestión Escolar</div>

      <div class="codigo">500</div>
      <div class="linea"></div>

      <h1 class="titulo">Algo falló de nuestro lado</h1>
      <p class="mensaje">
        Ocurrió un error inesperado en el servidor. No es culpa de lo que
        hiciste: intenta de nuevo en unos minutos y, si continúa, avisa al
        encargado del sistema.
      </p>

      <div class="acciones">
        <button class="boton" type="button" onclick="location.reload()">
          Intentar de nuevo
        </button>
        <a class="boton-secundario" href="/">Volver al inicio</a>
      </div>

      <p class="pie">Error 500 · Error interno del servidor</p>
    </main>
  </body>
</html>
