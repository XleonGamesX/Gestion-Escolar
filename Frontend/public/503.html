<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>503 · Servicio no disponible — Gestión Escolar</title>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <main class="pagina-error">
      <div class="marca">Gestión Escolar</div>

      <div class="codigo">503</div>
      <div class="linea"></div>

      <h1 class="titulo">No pudimos conectar con el servidor</h1>
      <p class="mensaje">
        La aplicación no responde en este momento. Revisa que el backend esté
        encendido (puerto 4500) y vuelve a intentar.
      </p>

      <div class="acciones">
        <button class="boton" type="button" onclick="location.reload()">
          Intentar de nuevo
        </button>
        <a class="boton-secundario" href="/">Volver al inicio</a>
      </div>

      <p class="pie">Error 503 · Servicio no disponible</p>
    </main>
  </body>
</html>
