<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · Página no encontrada — Gestión Escolar</title>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <main class="pagina-error">
      <div class="marca">Gestión Escolar</div>

      <div class="codigo">404</div>
      <div class="linea"></div>

      <h1 class="titulo">No encontramos esa página</h1>
      <p class="mensaje">
        La dirección que escribiste no existe o cambió de lugar. Revisa la URL
        o vuelve al inicio para seguir navegando.
      </p>

      <div class="acciones">
        <a class="boton" href="/">Volver al inicio</a>
        <button class="boton-secundario" type="button" onclick="history.back()">
          Volver atrás
        </button>
      </div>

      <p class="pie">Error 404 · Página no encontrada</p>
    </main>
  </body>
</html>
